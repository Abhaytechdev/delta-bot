# Machine-readable parameters for knowledge/core.md. Keep both in sync.
version: 2.3

structure:
  swing_left: 3          # candles before a swing point
  swing_right: 3         # candles after (confirmation delay, no lookahead)
  htf_factor: 4          # higher timeframe = 4x trading timeframe
  zone_memory: 4         # how many recent swing lows/highs act as support/resistance
  zone_atr: 0.5          # "at a level" = within this many ATR of a zone
  min_retrace: 0.382     # pullback depth into the last leg to count as discount

psychology:
  overextended_atr: 3.0  # distance from EMA50 in ATR = FOMO zone
  volume_spike: 2.0      # x 20-candle average volume
  capitulation_atr: 2.5  # candle range in ATR
  compression: 0.7       # ATR / 100-candle median ATR

weights:
  htf_trend: 2.0
  ltf_trend: 1.0
  at_level: 1.5
  discount: 1.0
  sweep: 2.0
  engulfing: 1.5
  pin_bar: 0          # v2: removed, hurt results in two ablations
  strong_candle: 1.0
  bos: 1.0
  entry_trend: 0      # multi-timeframe mode only
  pd_sweep: 0         # tested v2: lowered avg R
  fvg: 0              # tested v2: lowered avg R
  round_level: 0      # tested v2: lowered avg R
  volume_spike: 0.5
  compression: 0      # v2: removed (no edge)
  session_open: 0     # v2: removed (no edge)
  weekend: -1.0
  overextended: -2.0
  news_aligned: 1.0
  news_against: -5.0

entry:
  min_score: 7.5           # v2.3 (owner approved 2026-10-08): only high-confluence setups. 6y backtest, 3 coins: +0.35R/+0.32R per trade in 2020-23/2023-26 (was +0.06R/+0.13R), ~1.1 trades/week, max DD 21% (was 34%)
  min_triggers: 1          # v2.3: with the high score bar a single strong trigger is enough (2 triggers in v2.2 at score 5.0)
  against_bias_risk: 0.5   # v2.1: half risk when the trade fights the daily trend (EMA50/200 of daily closes)
  # tested and rejected (kept as knobs, off): max_chase_atr, require_ltf_trend, min_adx, min_er,
  # max_chop, min_daily_adx, daily_bias ("with" = better per trade but half the trades)

management:
  sl_buffer_atr: 0.25
  min_stop_atr: 0.75
  max_stop_atr: 4.0
  tp1_r: 2.0             # live bot: TP1 level (breakeven trigger); kept equal to be_r
  tp1_fraction: 0.0     # trial: no partial booking, TP1 only moves SL to breakeven (was 0.30)
  be_r: 2.0              # move SL to breakeven + fees at this R
  trail_start_r: 2.0     # trail behind swings from this R
  lock_steps: []         # [[trigger_R, lock_R], ...]
  chandelier_atr: 0      # 0 = off
  partials: []           # [[R, fraction], ...]
  target_r: 0            # 0 = no fixed target (runner only)
  stale_candles: 0       # 0 = off
  stale_r: 0
  be_fee_buffer: 0.0015  # move SL to entry +/- 0.15% (covers round-trip fees)
  trail_buffer_atr: 0.25
  runner_r: 10.0
  max_hold_days: 30
