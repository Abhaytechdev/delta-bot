# Delta bot configuration. Secrets go in .env, never here.
# Changes to strategy/risk settings require owner approval.

exchange:
  # Only "testnet" is allowed until the owner says "go live".
  environment: testnet
  rest_url: https://cdn-ind.testnet.deltaex.org
  ws_url: wss://socket-ind.testnet.deltaex.org

trading:
  pairs: [BTCUSD, ETHUSD, ADAUSD]   # perpetual futures (ADA added after backtest, knowledge v2)
  timeframe: 4h             # chosen by 3y backtest: only timeframe positive in- and out-of-sample
  # Entry/exit logic and trade management live in knowledge/core.yaml (+ core.md)

news:
  strong_threshold: 0.5     # |news score| >= this counts as "strong news" (score in -1..1)
  lookback_hours: 6

risk:
  max_leverage: 3
  risk_per_trade_pct: 1.0      # % of balance risked per trade
  max_open_positions: 3       # 3 x 1% = 3% max at risk = daily loss limit
  daily_loss_limit_pct: 3.0    # stop trading for the day when hit
  require_stop_loss: true      # every order must carry a stop-loss
  require_take_profit: true    # every order must carry a target

storage:
  db_path: data/bot.db

logging:
  level: INFO
  file: logs/bot.log

report:
  dir: reports
  timezone: Asia/Kolkata
  time: "23:55"
